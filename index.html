@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:800px){.ring{display:none}}
.tag{display:inline-block;font-size:.8rem;color:var(--accent);border:1px solid rgba(110,231,200,.35);padding:4px 12px;border-radius:99px;margin-bottom:22px}
h1{font-size:clamp(2.4rem,6vw,3.8rem);line-height:1.1;letter-spacing:-.035em;font-weight:700}
h1 .grad{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{max-width:600px;color:var(--muted);font-size:1.1rem;margin-top:20px}
.btns{display:flex;gap:12px;margin-top:32px;flex-wrap:wrap}
.btn{padding:11px 20px;border-radius:10px;font-weight:500;font-size:.95rem;border:1px solid var(--line);transition:.2s}

.btn:hover{transform:translateY(-2px);border-color:var(--accent)}

/* sections */

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;transition:.2s}

/* timeline */

h3.sub{font-size:1rem;color:var(--muted);font-weight:500;m<header class="hero"><div class="wrap">

  <span class="tag mono">PhD Researcher · Biophysics · Jagiellonian University</span>
  <h1>Satyam Tiwari<br><span class="grad">CT-less PET imaging.</span></h1>
  <p>I turn photons that PET scanners usually discard into signal. In the J-PET group I develop Detector-Scattered Attenuation Correction (DSAC): attenuation maps from detector-scattered coincidences, with no CT scan, for low-cost plastic-scintillator total-body PET.</p>
  <div class="btns">
    <a class="btn primary" href="#publications">Publications</a>
    <a class="btn" href="cv.pdf">Download CV</a>
    <a class="btn" href="mailto:satyam.tiwari@doctoral.uj.edu.pl">Get in touch</a>
  </div>
</div></header>

<section id="research"><div class="wrap">
  <div class="label mono">// research</div>
  <h2>What I work on</h2>
  <div class="grid">
    <div class="card"><h3>CT-less PET</h3><p>Quantitative attenuation correction from detector-scattered and annihilation data in plastic-scintillator PET.</p></div>
    <div class="card"><h3>Total-body reconstruction</h3><p>Simulation-driven methods (GATE / Monte Carlo) for attenuation-map estimation and better lesion localisation.</p></div>
    <div class="card"><h3>AI for medical imaging</h3><p>Deep-learning denoising and enhancement of attenuation maps for robust CT-less workflows.</p></div>
  </div>
  <div class="grid" style="margin-top:16px">
    <div class="card"><div class="stat">15</div><p>publications &amp; preprints</p></div>
    <div class="card"><div class="stat">9</div><p>conference talks &amp; posters</p></div>
    <div class="card"><div class="stat">🏆</div><p>Presentation Award, Total-Body PET 2026 (UC Davis)</p></div>
  </div>
  <p style="color:var(--muted);margin-top:20px;font-size:.92rem">Supervisors: Prof. Paweł Moskal &amp; Dr. Sushil K. Sharma · Team member, MAESTRO grant project</p>
</div></section>
