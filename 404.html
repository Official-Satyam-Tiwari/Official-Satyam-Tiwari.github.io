<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · Satyam Tiwari</title><meta name="robots" content="noindex"><link rel="icon" type="image/png" href="/favicon.png">
<style>
:root{--bg:#0a0a0b;--text:#ededef;--muted:#8f8f98;--accent:#6ee7c8;--line:#1f1f23}
@media(prefers-color-scheme:light){:root{--bg:#fafaf9;--text:#121216;--muted:#5b5b66;--accent:#0f9a7c;--line:#e5e5ea}}
*{margin:0;box-sizing:border-box}body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100svh;display:grid;place-items:center;padding:24px;text-align:center}
.code{font:600 clamp(4rem,18vw,8rem)/1 ui-monospace,monospace;letter-spacing:-.04em;color:var(--accent);opacity:.9}
h1{font-size:1.4rem;margin:16px 0 8px;font-weight:600}p{color:var(--muted);max-width:440px;margin:0 auto 26px;line-height:1.6}
a{display:inline-block;padding:10px 18px;border-radius:8px;background:var(--text);color:var(--bg);text-decoration:none;font-weight:500}
.ring{width:120px;height:120px;margin:0 auto 10px;border:2px dashed var(--line);border-radius:50%;position:relative;animation:spin 20s linear infinite}
.ring::after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:var(--accent);top:-6px;left:50%;margin-left:-5px}
@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.ring{animation:none}}
</style></head><body><main>
<div class="ring" aria-hidden="true"></div>
<div class="code">404</div>
<h1>This page was fully attenuated.</h1>
<p>Not a single photon made it here. No CT scan is needed to find your way back, though.</p>
<a href="/">Back to the homepage</a>
</main></body></html>
